<style>

  --head:#000000; --pos:#3dbf86; --pos2:#2b9a68; --neu:#76767f; --warn:#f0a040; --neg:#f06262;
  --pos-bg:#12352a; --warn-bg:#3b2a12; --neg-bg:#3d1b1b; --neu-bg:#26262c; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}

.chartwrap{overflow-x:auto}
svg text{fill:var(--muted);font-family:var(--text);font-size:12px}

.empty{padding:36px 20px;text-align:center;color:var(--muted)}

.path{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}

.item{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px;margin-top:10px;background:var(--soft)}
.drop{border:2px dashed var(--line);border-radius:14px;padding:26px;text-align:center;color:var(--muted);background:var(--soft)}

.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0}
.kv div{background:var(--soft);border-radius:10px;padding:10px 12px} .kv b{display:block;font-family:var(--disp);font-size:26px;line-height:1.1} .kv span{font-size:12px;color:var(--muted)}
label.f{display:grid;gap:6px;font-size:13px;font-weight:600;margin-top:14px}
input[type=text],select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%}
.msg{font-size:13px;margin-top:10px;padding:10px 12px;border-radius:9px;background:var(--soft2)}

.mtabs{display:flex;gap:6px;margin:14px 0 6px}
.clk{cursor:pointer;transition:box-shadow .15s,transform .15s}.clk:hover{box-shadow:0 0 0 2px var(--line),0 6px 18px rgba(0,0,0,.08)}.clk:focus-visible{outline:2px solid var(--brand);outline-offset:2px}.clk.on{box-shadow:0 0 0 2px var(--brand)}
.pill.soft{background:transparent;border:1px dashed var(--warn);color:var(--warn)}
.soft-card{display:block}

.clkrow{cursor:pointer;font:inherit;color:inherit}.clkrow:hover{background:var(--soft2)}.go{color:var(--muted);margin-left:4px}
.tl{margin-top:14px;border-left:2px solid var(--line);padding-left:16px;display:grid;gap:18px}
.tlday{position:relative}.tlday:before{content:"";position:absolute;left:-23px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 3px var(--card)}
.tlh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.tlit{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;align-items:start;margin-bottom:8px}.tlt{font-size:12px;color:var(--muted);padding-top:12px;font-variant-numeric:tabular-nums}

.story{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap;margin-bottom:18px}

.steplab span{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--brand);color:#fff;font-size:13px}
.chipk{font-size:12px;font-weight:600;border-radius:99px;padding:2px 10px}.chipk.neg{background:var(--neg-bg);color:var(--neg)}.chipk.ok{background:var(--pos-bg);color:var(--pos)}
.th .l2{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}.th .l2 b{color:var(--ink)}.th .l2 .rt{margin-left:auto;font-weight:600;color:var(--ink)}

.th{cursor:pointer}.th:hover{background:var(--soft2)}

<body>

<div class="wrap">
<main id="app"><section class="card empty"><h3 class="disp">Carregando a base de atendimentos</h3><p>Buscando a planilha mais recente.</p></section></main>
<footer id="foot"></footer>
</div>
<div class="top"><div class="wrap">
  <div class="brand"><div class="mark" aria-hidden="true">P</div><div><h1>Projeto Puma Assistente Virtual</h1><p>Atendimento do bot no HiBot · retenção, temas e mensagens por data de teste</p></div></div>
  <div class="top-r"><span class="date" id="today"></span><button class="btn dark" id="btnBase" data-act="openBase" type="button">Atualizar base</button></div>
</div></div>
<div id="tip" role="tooltip"></div>
<div class="ovl" id="ovl" role="dialog" aria-modal="true"><div class="modal" id="modal"></div></div>
<script>
/* ===== Lógica de dados (pura) ===== */
var LABEL_FIX = function (s) { return String(s == null ? '' : s).replace(/\s*\n\s*/g, ' ').replace(/ {2,}/g, ', ').trim(); };

function parseDelimited(text) {
  text = text.replace(/^﻿/, '');
  var first = text.split(/\r?\n/, 1)[0] || '';
  var delim = (first.split(';').length >= first.split(',').length) ? ';' : ',';
  var rows = [], row = [], cur = '', q = false, i = 0, n = text.length, ch;
  while (i < n) {
    ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += ch;
    } else if (ch === '"') q = true;
    else if (ch === delim) { row.push(cur); cur = ''; }
    else if (ch === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (ch === '\r') { /* ignora */ }
    else cur += ch;
    i++;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(function (r) { return r.some(function (c) { return String(c).trim() !== ''; }); });

      '<div style="overflow-wrap:anywhere">' + esc(it.msg || '(sem mensagem inicial)') + '</div>' + (it.r.k ? '<div class="msg" style="margin:0"><b>Texto de "Outras dúvidas" (vai para a inbox):</b> ' + esc(it.r.k) + '</div>' : '') +
      '<div class="meta" style="font-size:12px;color:var(--muted)">' + fdt(it.r.t) + '</div><details class="how" style="margin:0"><summary>Caminho no bot</summary><div class="path">' + pathChips(it.r) + '</div></details></div>';
  }
  function listModal(title, subt, items) {
    var st = stats(items);
    openModal('<h3>' + esc(title) + '</h3><p class="sub" style="margin:0 0 8px">' + esc(subt) + ' · ' + st.n + ' atendimentos' + (S.focus ? ' · ' + esc(FOC[S.focus].label.toLowerCase()) : ' · ' + f1(st.rate) + '% retidos') + '</p>' + dist(st, 10) + items.slice().sort(function (a, b) { return a.r.t < b.r.t ? 1 : -1; }).map(itemBlock).join(''));
  }

  function timelineModal(theme) {
    var items = sub(S.A.items.filter(function (it) { return it.theme === theme; })).sort(function (a, b) { return a.r.t < b.r.t ? -1 : 1; });
    var full = S.A.items.filter(function (it) { return it.theme === theme; }), st = stats(items), sf = stats(full);
    var days = {}, order = [];
    items.forEach(function (it) { var d = it.r.t.slice(0, 10); if (!days[d]) { days[d] = []; order.push(d); } days[d].push(it); });
    var body = order.map(function (d) {
      var l = days[d], s = stats(l), rounds = {}; l.forEach(function (it) { rounds[it.round] = 1; });
      return '<div class="tlday"><div class="tlh"><b>' + fd(d) + '</b><span class="tag">' + Object.keys(rounds).join(', ') + '</span><span style="color:var(--muted);font-size:12px">' + l.length + ' atend.' + (S.focus ? '' : ' · ' + f0(s.rate) + '% retidos') + '</span></div>' + l.map(function (it) { return '<div class="tlit"><span class="tlt">' + it.r.t.slice(11, 16) + '</span>' + itemBlock(it) + '</div>'; }).join('') + '</div>';
    }).join('');
    openModal('<h3>' + esc(theme) + ' · linha do tempo</h3><p class="sub" style="margin:0 0 8px">' + st.n + ' atendimento(s)' + (S.focus ? ' (' + esc(FOC[S.focus].label.toLowerCase()) + ') de ' + sf.n + ' no tema' : ' · ' + f1(sf.rate) + '% retidos · ' + sf.ticket + ' ticket(s) · ' + sf.soft + ' possível(is) retenção') + ', do mais antigo ao mais recente</p>' + dist(st, 10) + '<div class="tl">' + (body || '<p class="sub">Nenhum atendimento.</p>') + '</div>');
  }

  /* ---------- base de dados ---------- */
  function previewHtml(p) {
    var cp = { defaultTest: S.pendTest, testMap: S.pendMap, emailContinue: S.cfg.emailContinue }, an = analyze(p.records, cp), st = stats(an.items), nRes = st.out.sim_encerrar + st.out.sim_ajudou, days = recDays(p.records);
    return '<label class="f">Esta base é de qual teste?' + testSel('id="pendTest"', S.pendTest) + '<span style="font-weight:400;color:var(--muted)">Todas as datas da planilha entram neste teste (ex.: TU1). Cada data vira um dia dentro dele.</span></label>' +
      '<div class="kv"><div><b>' + st.n + '</b><span>atendimentos</span></div><div><b>' + f1(st.rate) + '%</b><span>possível retenção</span></div><div><b>' + st.ticket + '</b><span>tickets</span></div><div><b>' + f1(pct(nRes, st.n)) + '%</b><span>retenção confirmada</span></div></div>' +
      '<p class="sub">Período: ' + fd(st.from) + ' a ' + fd(st.to) + ' · teste ' + esc(an.rounds.map(function (r) { return r.id; }).join(', ')) + (p.skipped ? ' · ' + p.skipped + ' linha(s) ignorada(s) por data inválida' : '') + '</p>' +
      '<details class="how"' + (Object.keys(S.pendMap).length ? ' open' : '') + '><summary>Algumas datas são de outro teste?</summary><div class="dgrid">' + days.map(function (d) { return '<label>' + dm(d) + '/' + d.slice(0, 4) + testSel('class="pdate" data-d="' + d + '"', S.pendMap[d] || S.pendTest) + '</label>'; }).join('') + '</div></details>' +
      '<div class="msg">Ao confirmar, <b>toda a base atual é apagada</b> (' + (S.records.length) + ' atendimentos) e esta planilha passa a ser a fonte de dados do painel.</div>' +
      '<div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap"><button class="btn pri" data-act="confirmUpload" type="button"' + (S.busy ? ' disabled' : '') + '>Substituir base atual</button><button class="btn" data-act="cancelUpload" type="button">Cancelar</button></div>';
  }
  function baseModal() {
    var m = S.meta, tabs = '<div class="mtabs"><button class="chip ' + (S.baseTab === 'base' ? 'on' : '') + '" data-act="baseTab" data-k="base" type="button">Base de dados</button><button class="chip ' + (S.baseTab === 'rules' ? 'on' : '') + '" data-act="baseTab" data-k="rules" type="button">Regras</button></div>';
    var body = '';
    if (S.baseTab === 'base') {
      body = '<p class="sub">Base atual: <b>' + (m ? esc(m.fileName || 'planilha') + '</b> · ' + m.count + ' atendimentos' : (S.records.length ? 'carregada só neste navegador</b> · ' + S.records.length + ' atendimentos' : 'vazia</b>')) + '</p>' +
        (S.canWrite ? '<div class="drop" id="drop"><p style="margin:0 0 10px">Arraste a planilha aqui ou escolha o arquivo (CSV da exportação do HiBot; XLSX também funciona)</p><input type="file" id="file" accept=".csv,.xlsx,.xls,text/csv" style="max-width:100%"></div>' : '<div class="msg">Seu acesso é só de leitura: não é possível trocar a base.</div>') +
        (S.note ? '<div class="msg ' + S.note.k + '">' + esc(S.note.t) + '</div>' : '') + (S.pending ? previewHtml(S.pending) : '') + (S.static && S.records.length ? '<div style="margin-top:14px"><button class="btn" data-act="dlBase" type="button">Baixar base.json (para publicar no GitHub)</button></div>' : '');
    } else {
      var rdays = recDays(S.records);
      body = '<label class="f">Teste padrão da base' + testSel('id="cfgDefault"', S.cfg.defaultTest) + '<span style="font-weight:400;color:var(--muted)">Todas as datas entram neste teste, a menos que você escolha outro abaixo.</span></label>' +
        (rdays.length ? '<details class="how" style="margin-bottom:12px"><summary>Teste de cada data</summary><div class="dgrid">' + rdays.map(function (d) { return '<label>' + dm(d) + '/' + d.slice(0, 4) + testSel('class="rdate" data-d="' + d + '"', S.cfg.testMap[d] || S.cfg.defaultTest) + '</label>'; }).join('') + '</div></details>' : '') +
        '<label class="f" style="grid-template-columns:auto 1fr;align-items:start;gap:10px"><input type="checkbox" id="cfgMail"' + (S.cfg.emailContinue ? ' checked' : '') + ' style="margin-top:3px"><span>Contar "Continuar por e-mail" como ticket, mesmo sem "Outras dúvidas" preenchida<br><span style="font-weight:400;color:var(--muted)">Desligado segue a regra combinada: só "Outras dúvidas" (coluna BP) indica ticket.</span></span></label>' +
        '<div style="margin-top:16px"><button class="btn pri" data-act="saveCfg" type="button">Salvar regras</button></div>' + (S.note ? '<div class="msg ' + S.note.k + '">' + esc(S.note.t) + '</div>' : '');
    }
    openModal('<h3>Atualizar base</h3>' + tabs + body);
    wireFile();
  }
  function wireFile() {
    var inp = $('file'), drop = $('drop');
    if (inp) inp.addEventListener('change', function () { if (inp.files[0]) readFile(inp.files[0]); });
    if (drop) {
      ['dragenter', 'dragover'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); }); });
      ['dragleave', 'drop'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); }); });
      drop.addEventListener('drop', function (e) { var f = e.dataTransfer && e.dataTransfer.files[0]; if (f) readFile(f); });
    }
  }
  function loadSheetJS() {
    return new Promise(function (res, rej) {
      if (window.XLSX) return res(window.XLSX);
      var s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      s.onload = function () { res(window.XLSX); }; s.onerror = function () { rej(new Error('Não consegui carregar o leitor de XLSX. Envie a planilha em CSV.')); }; document.head.appendChild(s);
    });
  }
  function readFile(file) {
    S.pending = null; S.note = { k: '', t: 'Lendo ' + file.name + '…' }; baseModal();
    var fr = new FileReader();
    fr.onerror = function () { S.note = { k: 'err', t: 'Não consegui ler o arquivo.' }; baseModal(); };
    fr.onload = function () {
      var buf = fr.result, table;
      var done = function (table) {
        var res = tableToRecords(table);
        if (res.error) { S.note = { k: 'err', t: res.error }; S.pending = null; return baseModal(); }
        if (!res.records.length) { S.note = { k: 'err', t: 'Nenhum atendimento com data válida foi encontrado.' }; return baseModal(); }
        S.pending = { fileName: file.name, records: res.records, skipped: res.skipped }; S.pendTest = S.cfg.defaultTest || 'TU1'; S.pendMap = {}; S.note = null; baseModal();
      };
      try {
        if (/\.xlsx?$/i.test(file.name)) {
          loadSheetJS().then(function (X) { var wb = X.read(buf, { type: 'array' }); var ws = wb.Sheets[wb.SheetNames[0]]; done(X.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' })); }).catch(function (e) { S.note = { k: 'err', t: e.message }; baseModal(); });
        } else {
          var txt; try { txt = new TextDecoder('utf-8', { fatal: true }).decode(buf); } catch (e) { txt = new TextDecoder('windows-1252').decode(buf); }
          done(parseDelimited(txt));
        }
      } catch (e) { S.note = { k: 'err', t: 'Erro ao interpretar a planilha: ' + e.message }; baseModal(); }
    };
    fr.readAsArrayBuffer(file);
  }
  function sizeChunks(records) {
    var out = [], cur = [], sz = 0;
    records.forEach(function (r) { var l = JSON.stringify(r).length; if (cur.length && sz + l > 150000) { out.push(cur); cur = []; sz = 0; } cur.push(r); sz += l; });
    if (cur.length) out.push(cur); return out;
  }
  function pad(n) { return ('000' + n).slice(-3); }
  async function confirmUpload() {
    var p = S.pending; if (!p || S.busy) return; S.busy = 'save'; S.note = { k: '', t: 'Salvando…' }; baseModal();
    try {
      var ncfg = { defaultTest: S.pendTest, testMap: S.pendMap, emailContinue: S.cfg.emailContinue };
      if (S.static) {
        S.cfg = ncfg;
        var m0 = { batch: Date.now().toString(36), chunks: 1, count: p.records.length, fileName: p.fileName, uploadedAt: new Date().toISOString() };
        var okS = lsSet({ records: p.records, meta: m0, cfg: ncfg });
        S.meta = m0; S.records = p.records; S.pending = null; S.fromLocal = true;
        S.note = okS ? { k: 'ok', t: 'Base substituída neste navegador: ' + m0.count + ' atendimentos. Para o time inteiro ver, baixe o base.json abaixo e troque o arquivo no GitHub.' } : { k: 'err', t: 'Base aplicada, mas o navegador não deixou salvar (armazenamento cheio ou bloqueado).' };
        S.busy = ''; recompute(true); render(); baseModal(); return;
      }
      if (!S.db) throw { code: 'nodb' };
      var batch = Date.now().toString(36), chunks = sizeChunks(p.records);
      for (var i = 0; i < chunks.length; i++) { await S.db.doc('base/rows-' + batch + '-' + pad(i)).set({ batch: batch, i: i, rows: chunks[i] }); }
      var meta = { batch: batch, chunks: chunks.length, count: p.records.length, fileName: p.fileName, uploadedAt: new Date().toISOString() };
      await S.db.doc('base/meta').set(meta);
      await S.db.doc('base/config').set(ncfg); S.cfg = ncfg;
      var old = await S.db.collection('base').get();
      for (var j = 0; j < old.docs.length; j++) { var d = old.docs[j], dd = d.data() || {}; if (/^rows-/.test(d.id) && dd.batch !== batch) await S.db.doc('base/' + d.id).delete(); }
      S.meta = meta; S.records = p.records; S.pending = null; S.note = { k: 'ok', t: 'Base substituída: ' + meta.count + ' atendimentos de ' + meta.fileName + '.' };
    } catch (e) {
      S.meta = null; S.records = p.records; S.pending = null; S.localOnly = true; S.cfg = ncfg;
      S.note = { k: 'err', t: (e && e.code === 'nodb' ? 'O salvamento compartilhado não está disponível nesta visualização.' : 'Não consegui salvar para todos (' + ((e && (e.message || e.code)) || 'erro') + ').') + ' A planilha foi aplicada só neste navegador.' };
    }
    S.busy = ''; recompute(true); render(); baseModal();
  }
  async function saveCfg() {
    var dflt = $('cfgDefault').value, tm = {};
    Array.prototype.forEach.call(document.querySelectorAll('.rdate'), function (el) { if (el.value !== dflt) tm[el.getAttribute('data-d')] = el.value; });
    S.cfg = { defaultTest: dflt, testMap: tm, emailContinue: $('cfgMail').checked };
    var ok = true;
    if (S.static) { var cur = lsGet() || { records: S.records, meta: S.meta }; cur.cfg = S.cfg; ok = lsSet(cur); if (ok) { S.note = { k: 'ok', t: 'Regras salvas neste navegador. Para valerem para o time, baixe o base.json e troque no GitHub.' }; recompute(true); render(); return baseModal(); } }
    else if (S.db) { try { await S.db.doc('base/config').set(S.cfg); } catch (e) { ok = false; } } else ok = false;
    S.note = ok ? { k: 'ok', t: 'Regras salvas.' } : { k: 'err', t: 'Regras aplicadas só neste navegador (não consegui salvar para todos).' };
    recompute(true); render(); baseModal();
  }

  /* ---------- banco compartilhado ---------- */
  var tmr = null;
  function applySnapshot(snap) {
    var docs = {}; snap.docs.forEach(function (d) { docs[d.id] = d.data(); });
    if (docs.config) S.cfg = normCfg(docs.config);
    var meta = docs.meta;
    if (!meta) { if (!S.localOnly) { S.meta = null; S.records = []; } }
    else {
      var chunks = snap.docs.filter(function (d) { return /^rows-/.test(d.id) && d.data().batch === meta.batch; }).sort(function (a, b) { return a.data().i - b.data().i; });
      if (chunks.length < meta.chunks) return;
      var rows = []; chunks.forEach(function (c) { rows = rows.concat(c.data().rows || []); });
      S.records = rows; S.meta = meta; S.localOnly = false;
    }
    S.status = 'ready'; clearTimeout(tmr); tmr = setTimeout(function () { recompute(false); render(); if ($('ovl').classList.contains('open') && S.openFile) baseModal(); }, 120);
  }
  var LS = 'puma-assistente-base-v1';
  function lsGet() { try { return JSON.parse(localStorage.getItem(LS) || 'null'); } catch (e) { return null; } }
  function lsSet(o) { try { localStorage.setItem(LS, JSON.stringify(o)); return true; } catch (e) { return false; } }
  async function initStatic() {
    S.static = true; S.canWrite = true;
    var base = null;
    try { var r = await fetch('base.json', { cache: 'no-store' }); if (r.ok) base = await r.json(); } catch (e) {}
    var loc = lsGet(), use = loc && loc.records && loc.records.length ? loc : base;
    if (use && use.records) { S.records = use.records; S.meta = use.meta || null; if (use.cfg) S.cfg = normCfg(use.cfg); S.fromLocal = use === loc; }
    S.status = 'ready'; recompute(true); render();
  }
  async function initDb() {
    try {
      var u = window.claude && await window.claude.use('user');
      if (u && u.can) { var c = u.can('data.write'); S.canWrite = c !== false; }
    } catch (e) {}
    try {
      var db = window.claude && await window.claude.use('db');
      if (!db) { await initStatic(); return; }
      S.db = db;
      db.collection('base').onSnapshot(applySnapshot, function () { S.status = 'ready'; render(); });
    } catch (e) { await initStatic(); }
  }

  /* ---------- eventos ---------- */
  document.addEventListener('click', function (e) {
    if (e.target.id === 'ovl') return closeModal();
    var b = e.target.closest('[data-act]'); if (!b) return;
    var a = b.getAttribute('data-act'), d = b.dataset;
    if (a === 'close') closeModal();
    else if (a === 'openBase') { S.baseTab = 'base'; S.openFile = true; S.note = null; S.pending = null; baseModal(); }
    else if (a === 'baseTab') { S.baseTab = d.k; S.note = null; baseModal(); }
    else if (a === 'cancelUpload') { S.pending = null; S.note = null; baseModal(); }
    else if (a === 'confirmUpload') confirmUpload();
    else if (a === 'saveCfg') saveCfg();
    else if (a === 'dlBase') { var blob = new Blob([JSON.stringify({ meta: S.meta, cfg: S.cfg, records: S.records })], { type: 'application/json' }), u = URL.createObjectURL(blob), al = document.createElement('a'); al.href = u; al.download = 'base.json'; document.body.appendChild(al); al.click(); al.remove(); setTimeout(function () { URL.revokeObjectURL(u); }, 1000); }
    else if (a === 'selAll') { var rs = roundsOf(d.type), all = rs.every(function (r) { return S.sel[r.id]; }), other = S.A.rounds.some(function (r) { return r.type !== d.type && S.sel[r.id]; }); if (all && !other) return; rs.forEach(function (r) { S.sel[r.id] = !all; }); render(); }
    else if (a === 'selToggle') { var n = S.A.rounds.filter(function (r) { return S.sel[r.id]; }).length; if (S.sel[d.id] && n === 1) return; S.sel[d.id] = !S.sel[d.id]; render(); }
    else if (a === 'tab') { S.tab = d.id; render(); }
    else if (a === 'cmDay') { S.cm.day = d.id ? (S.cm.day === d.id ? null : d.id) : null; S.cm.limit = 40; render(); }
    else if (a === 'cmOut') { S.cm.out = d.k; S.cm.limit = 40; render(); }
    else if (a === 'more') { S.cm.limit += 40; render(); }
    else if (a === 'item') { var it = S.A.items[+d.i]; if (it) openModal('<h3>Atendimento</h3><p class="sub" style="margin:0">' + esc(it.r.id) + '</p>' + itemBlock(it)); }
    else if (a === 'focus') { S.focus = (d.k && d.k !== S.focus) ? d.k : null; render(); }
    else if (a === 'themeAll') timelineModal(d.t);
    else if (a === 'theme') { listModal(d.t, S.tab === 'all' ? 'Todos os dias' : dm(S.tab), sub(curItems()).filter(function (it) { return it.theme === d.t; })); }
    else if (a === 'tester') { var items = sub(curItems()).filter(function (it) { return it.r.n.trim().toLowerCase() === d.k; }); listModal(items[0] ? items[0].r.n : d.k, S.tab === 'all' ? 'Todos os dias' : dm(S.tab), items); }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'pendTest') { S.pendTest = t.value; S.pendMap = {}; baseModal(); }
    else if (t.classList && t.classList.contains('pdate')) { var dd = t.getAttribute('data-d'); if (t.value === S.pendTest) delete S.pendMap[dd]; else S.pendMap[dd] = t.value; baseModal(); }
  });
  /* tooltip das barras de desfecho */
  var tipEl = $('tip');
  function tipShow(seg, x, y) {
    var n = +seg.getAttribute('data-tn'), tot = +seg.getAttribute('data-tt');
    tipEl.innerHTML = esc(seg.getAttribute('data-tl')) + '<br><b>' + n + '</b> de ' + tot + ' atendimento' + (tot === 1 ? '' : 's') + ' · <b>' + seg.getAttribute('data-tp') + '%</b>';
    tipEl.style.display = 'block';
    var w = tipEl.offsetWidth, h = tipEl.offsetHeight, nx = x + 14, ny = y - h - 12;
    if (nx + w > window.innerWidth - 8) nx = x - w - 14;
    if (nx < 8) nx = 8;
    if (ny < 8) ny = y + 18;
    tipEl.style.left = nx + 'px'; tipEl.style.top = ny + 'px';
  }
  function tipHide() { tipEl.style.display = 'none'; }
  document.addEventListener('mousemove', function (e) { var seg = e.target.closest && e.target.closest('.dist i[data-tn]'); if (seg) tipShow(seg, e.clientX, e.clientY); else tipHide(); });
  document.addEventListener('mouseleave', tipHide);
  document.addEventListener('touchstart', function (e) { var seg = e.target.closest && e.target.closest('.dist i[data-tn]'); if (seg && e.touches[0]) tipShow(seg, e.touches[0].clientX, e.touches[0].clientY); else tipHide(); }, { passive: true });
  document.addEventListener('scroll', tipHide, true);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); else if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('clk')) { e.preventDefault(); e.target.click(); } });
  $('today').textContent = new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

  recompute(true); render(); initDb();
})();
