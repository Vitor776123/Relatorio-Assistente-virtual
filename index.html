<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Projeto Puma Assistente Virtual</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: página única de painel, cabeçalho preto, seções empilhadas com cartões brancos; condensada para títulos e números, DIN-like para texto. */
:root{
  --bg:#f1f1f3; --card:#ffffff; --ink:#0c0c0e; --muted:#66666e; --line:#e1e1e6; --soft:#f5f5f7; --soft2:#ececf0;
  --brand:#ff0000; --head:#0c0c0e; --head-ink:#ffffff;
  --pos:#1d8a5a; --pos2:#126a45; --neu:#9a9aa4; --warn:#e08a1e; --neg:#cc2b2b;
  --pos-bg:#dcf1e7; --warn-bg:#fdebd3; --neg-bg:#fadcdc; --neu-bg:#e9e9ee;
  --shadow:0 1px 2px rgba(12,12,14,.06),0 8px 24px rgba(12,12,14,.05);
  --disp:'Barlow Condensed','Arial Narrow',Arial,sans-serif; --text:'Barlow',Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0b0d; --card:#161619; --ink:#f3f3f5; --muted:#9d9da6; --line:#2a2a30; --soft:#1d1d21; --soft2:#26262c;
  --head:#000000; --pos:#3dbf86; --pos2:#2b9a68; --neu:#76767f; --warn:#f0a040; --neg:#f06262;
  --pos-bg:#12352a; --warn-bg:#3b2a12; --neg-bg:#3d1b1b; --neu-bg:#26262c; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0b0d; --card:#161619; --ink:#f3f3f5; --muted:#9d9da6; --line:#2a2a30; --soft:#1d1d21; --soft2:#26262c;
  --head:#000000; --pos:#3dbf86; --pos2:#2b9a68; --neu:#76767f; --warn:#f0a040; --neg:#f06262;
  --pos-bg:#12352a; --warn-bg:#3b2a12; --neg-bg:#3d1b1b; --neu-bg:#26262c; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:15px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,.disp{font-family:var(--disp);letter-spacing:.02em;margin:0;font-weight:700}
.wrap{max-width:1180px;margin:0 auto}
.top{background:var(--head);color:var(--head-ink);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:18px max(16px,env(safe-area-inset-left,0px));border-bottom:3px solid var(--brand)}
.top .wrap{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;gap:14px;align-items:center;min-width:0}
.mark{width:44px;height:44px;border-radius:10px;background:var(--brand);display:grid;place-items:center;font-family:var(--disp);font-weight:700;font-size:26px;color:#fff;flex:none}
.top h1{font-size:30px;line-height:1;text-transform:uppercase}
.top p{margin:4px 0 0;color:#b4b4bc;font-size:13px}
.top-r{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.date{font-size:13px;color:#b4b4bc}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;display:inline-flex;gap:8px;align-items:center}
.btn:hover{border-color:var(--ink)}
.btn.dark{background:#fff;color:#0c0c0e;border-color:#fff}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.pri:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
main{padding:28px 0 20px;display:grid;grid-template-columns:minmax(0,1fr);gap:44px}
section>.sh{display:flex;gap:14px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
section h2{font-size:34px;text-transform:uppercase;line-height:1}
section h2 svg{vertical-align:-3px;color:var(--brand);margin-right:6px}
.sub{color:var(--muted);font-size:14px;margin:6px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.card h3{font-size:20px;text-transform:uppercase;margin-bottom:12px}
.badge{font-family:var(--disp);font-weight:700;font-size:18px;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:6px 16px}
.badge.pos{background:var(--pos-bg);color:var(--pos)} .badge.warn{background:var(--warn-bg);color:var(--warn)} .badge.neg{background:var(--neg-bg);color:var(--neg)}
.filters{display:grid;gap:10px}
.frow{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap}
.flab{display:flex;gap:8px;align-items:center;min-width:150px;color:var(--muted);font-size:14px;font-weight:500}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid transparent;background:var(--soft2);color:var(--muted);border-radius:9px;padding:6px 13px;font-size:14px;font-weight:600}
.chip:hover{color:var(--ink)}
.chip.on{background:var(--ink);color:var(--bg)}
.chip.sub-on{background:var(--soft);color:var(--ink);border-color:var(--line)}
.chip small{opacity:.7;font-weight:500;margin-left:4px}
.chip.t-pos{color:var(--pos)} .chip.t-warn{color:var(--warn)} .chip.t-neg{color:var(--neg)}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.span2{grid-column:1/-1}
@media (min-width:900px){.span2{grid-column:span 2}}
.stat{position:relative;padding:18px 20px;min-height:140px}
.stat .lab{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat .val{font-family:var(--disp);font-weight:700;font-size:54px;line-height:1.02;margin-top:6px;font-variant-numeric:tabular-nums}
.stat .ss{color:var(--muted);font-size:13px;margin-top:4px}
.stat .ic{position:absolute;right:16px;top:16px;width:38px;height:38px;border-radius:9px;background:var(--soft2);display:grid;place-items:center;color:var(--muted)}
.stat.hl{border-color:var(--ink)}
.trend{display:inline-flex;gap:4px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;margin-top:6px}
.trend.up{background:var(--pos-bg);color:var(--pos)} .trend.dn{background:var(--neg-bg);color:var(--neg)}
.dist{display:flex;height:16px;border-radius:99px;overflow:hidden;background:var(--soft2)}
.dist i{display:block;height:100%}
.legend{display:flex;gap:8px 18px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--muted)}
.legend b{color:var(--ink);font-weight:600}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.o-sim_encerrar{background:var(--pos2)} .o-sim_ajudou{background:var(--pos)} .o-sem{background:var(--neu)} .o-nao{background:var(--warn)} .o-ticket{background:var(--neg)}
details.how{margin-top:12px;font-size:13px;color:var(--muted)}
details.how summary{cursor:pointer;font-weight:600;color:var(--ink)}
details.how p{margin:8px 0 0;max-width:80ch}
.note{display:flex;gap:10px;background:var(--warn-bg);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:13px;margin-top:12px}
.chartwrap{overflow-x:auto}
svg text{fill:var(--muted);font-family:var(--text);font-size:12px}
.rcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.rc{padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.rc .rn{font-family:var(--disp);font-weight:700;font-size:20px} .rc .rn span{color:var(--brand)}
.rc .rv{font-family:var(--disp);font-weight:700;font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}
.rc .rs{font-size:12px;color:var(--muted)}
.pp{font-size:12px;font-weight:600;border-radius:7px;padding:2px 8px;white-space:nowrap}
.pp.up{background:var(--pos-bg);color:var(--pos)} .pp.dn{background:var(--neg-bg);color:var(--neg)} .pp.eq{background:var(--neu-bg);color:var(--muted)}
.rows{display:grid;gap:8px}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--soft);border-radius:10px;padding:11px 14px;min-width:0}
.row .nm{font-weight:600;min-width:0;overflow-wrap:anywhere}
.row .mt{color:var(--muted);font-size:13px;white-space:nowrap;display:flex;gap:10px;align-items:center}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px}
.ul{list-style:none;margin:0;padding:0;display:grid;gap:9px;font-size:14px;color:var(--muted)}
.ul li{display:flex;gap:9px} .ul b{color:var(--ink)} .ul .g{color:var(--pos);font-weight:600} .ul .r{color:var(--neg);font-weight:600} .ul .w{color:var(--warn);font-weight:600}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 10px}
.tabs{display:grid;gap:8px;margin-bottom:16px}
.rtab{border:1px solid transparent;background:transparent;border-radius:9px;padding:6px 12px;font-family:var(--disp);font-weight:700;font-size:20px;color:var(--muted);display:inline-flex;gap:8px;align-items:baseline}
.rtab small{font-family:var(--text);font-size:12px;font-weight:600}
.rtab.on{background:var(--card);border-color:var(--line);color:var(--ink);box-shadow:var(--shadow)}
.rtab small.p{color:var(--pos)} .rtab small.w{color:var(--warn)} .rtab small.n{color:var(--neg)}
.rhead{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.rhead h3{font-size:38px}
.themes .th{display:grid;gap:8px;background:var(--soft);border-radius:10px;padding:12px 14px;text-align:left;border:0;width:100%}
.themes .th:hover{background:var(--soft2)}
.th .l1{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.th .l1 b{font-weight:600}
.th .l1 span{font-size:13px;font-weight:600}
.pos-t{color:var(--pos)} .warn-t{color:var(--warn)} .neg-t{color:var(--neg)}
.scroll{max-height:380px;overflow:auto;display:grid;gap:8px;padding-right:4px}
.av{width:34px;height:34px;border-radius:50%;background:var(--soft2);display:grid;place-items:center;font-weight:600;color:var(--muted);flex:none}
.pill{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:600;border-radius:99px;padding:3px 11px;white-space:nowrap}
.pill.o-sim_encerrar,.pill.o-sim_ajudou{background:var(--pos-bg);color:var(--pos)} .pill.o-nao{background:var(--warn-bg);color:var(--warn)} .pill.o-ticket{background:var(--neg-bg);color:var(--neg)} .pill.o-sem{background:var(--neu-bg);color:var(--muted)}
.pill.o-sim_encerrar,.pill.o-sim_ajudou,.pill.o-nao,.pill.o-ticket,.pill.o-sem{}
.cmts{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;margin-top:16px}
.cm{padding:14px 16px;display:grid;gap:8px;align-content:start}
.cm .who{display:flex;gap:10px;align-items:center;justify-content:space-between}
.cm .who b{font-weight:600}
.cm q{display:block;quotes:none;font-style:normal;font-size:15px;overflow-wrap:anywhere}
.cm .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.tag{background:var(--soft2);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:500;color:var(--muted)}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink)}
footer{border-top:1px solid var(--line);padding:20px 0 26px;color:var(--muted);font-size:13px;text-align:center}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px;z-index:50}
.ovl.open{display:flex}
.modal{background:var(--card);color:var(--ink);border-radius:16px;max-width:720px;width:100%;max-height:calc(100% - 8px);overflow:auto;padding:22px 24px;position:relative}
.modal .x{position:absolute;right:14px;top:14px;border:1px solid var(--line);background:var(--card);border-radius:8px;width:34px;height:34px}
.modal h3{font-size:28px;margin-bottom:4px;padding-right:40px}
.path{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.path .tag b{color:var(--ink);font-weight:600}
.item{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px;margin-top:10px;background:var(--soft)}
.drop{border:2px dashed var(--line);border-radius:14px;padding:26px;text-align:center;color:var(--muted);background:var(--soft)}
.drop.over{border-color:var(--ink);color:var(--ink)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0}
.kv div{background:var(--soft);border-radius:10px;padding:10px 12px} .kv b{display:block;font-family:var(--disp);font-size:26px;line-height:1.1} .kv span{font-size:12px;color:var(--muted)}
label.f{display:grid;gap:6px;font-size:13px;font-weight:600;margin-top:14px}
input[type=text],select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%}
.msg{font-size:13px;margin-top:10px;padding:10px 12px;border-radius:9px;background:var(--soft2)}
.msg.err{background:var(--neg-bg);color:var(--neg)} .msg.ok{background:var(--pos-bg);color:var(--pos)}
.mtabs{display:flex;gap:6px;margin:14px 0 6px}
.clk{cursor:pointer;transition:box-shadow .15s,transform .15s}.clk:hover{box-shadow:0 0 0 2px var(--line),0 6px 18px rgba(0,0,0,.08)}.clk:focus-visible{outline:2px solid var(--brand);outline-offset:2px}.clk.on{box-shadow:0 0 0 2px var(--brand)}
.pill.soft{background:transparent;border:1px dashed var(--warn);color:var(--warn)}
.soft-card{display:block}
.fbar{position:sticky;top:8px;z-index:20;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:14px}.fbar .btn{padding:6px 12px;color:#111;background:#fff;border-color:#fff}
.clkrow{cursor:pointer;font:inherit;color:inherit}.clkrow:hover{background:var(--soft2)}.go{color:var(--muted);margin-left:4px}
.tl{margin-top:14px;border-left:2px solid var(--line);padding-left:16px;display:grid;gap:18px}
.tlday{position:relative}.tlday:before{content:"";position:absolute;left:-23px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 3px var(--card)}
.tlh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.tlit{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;align-items:start;margin-bottom:8px}.tlt{font-size:12px;color:var(--muted);padding-top:12px;font-variant-numeric:tabular-nums}
@media (max-width:560px){.top h1{font-size:24px}section h2{font-size:28px}.stat .val{font-size:46px}.flab{min-width:100%}}
@media (prefers-reduced-motion:no-preference){.fade{animation:fd .35s ease-out}@keyframes fd{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>

<div class="top"><div class="wrap">
  <div class="brand"><div class="mark" aria-hidden="true">P</div><div><h1>Projeto Puma Assistente Virtual</h1><p>Atendimento do bot no HiBot · retenção, temas e mensagens por rodada de teste</p></div></div>
  <div class="top-r"><span class="date" id="today"></span><button class="btn dark" id="btnBase" data-act="openBase" type="button">Atualizar base</button></div>
</div></div>
<div class="wrap">
<main id="app"><section class="card empty"><h3 class="disp">Carregando a base de atendimentos</h3><p>Buscando a planilha mais recente.</p></section></main>
<footer id="foot"></footer>
</div>
<div class="ovl" id="ovl" role="dialog" aria-modal="true"><div class="modal" id="modal"></div></div>
<script>
/* ===== Lógica de dados (pura) ===== */
var LABEL_FIX = function (s) { return String(s == null ? '' : s).replace(/\s*\n\s*/g, ' ').replace(/ {2,}/g, ', ').trim(); };

function parseDelimited(text) {
  text = text.replace(/^﻿/, '');
  var first = text.split(/\r?\n/, 1)[0] || '';
  var delim = (first.split(';').length >= first.split(',').length) ? ';' : ',';
  var rows = [], row = [], cur = '', q = false, i = 0, n = text.length, ch;
  while (i < n) {
    ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += ch;
    } else if (ch === '"') q = true;
    else if (ch === delim) { row.push(cur); cur = ''; }
    else if (ch === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (ch === '\r') { /* ignora */ }
    else cur += ch;
    i++;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(function (r) { return r.some(function (c) { return String(c).trim() !== ''; }); });
}

function parseBrDate(s) {
  var m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/.exec(String(s || '').trim());
  if (!m) return null;
  var p = function (x) { return ('0' + x).slice(-2); };
  return m[3] + '-' + p(m[2]) + '-' + p(m[1]) + 'T' + p(m[4] || 0) + ':' + p(m[5] || 0) + ':' + p(m[6] || 0);
}

/* tabela (matriz) -> atendimentos compactos */
function tableToRecords(table) {
  if (!table.length) return { records: [], error: 'A planilha está vazia.' };
  var head = table[0].map(function (h) { return String(h == null ? '' : h).trim(); });
  var idx = function (re) { for (var i = 0; i < head.length; i++) if (re.test(head[i].normalize('NFD').replace(/[̀-ͯ]/g, ''))) return i; return -1; };
  var iId = idx(/^id\.?\s*atendimento/i), iDate = idx(/^data/i), iCons = idx(/^id\.?\s*consumidor/i), iName = idx(/^nome/i), iIdent = idx(/^identifica/i);
  if (iId < 0 || iDate < 0 || iName < 0) return { records: [], error: 'Não encontrei as colunas "Id. Atendimento", "Data" e "Nome". Confira se a planilha é a exportação de variáveis de registro.' };
  var tagCols = [], lastTicket = -1, firstTicket = -1;
  for (var c = 0; c < head.length; c++) {
    if (/^tag_/i.test(head[c])) {
      tagCols.push(c);
      if (/^tag_outras_duvidas$/i.test(head[c])) { if (firstTicket < 0) firstTicket = c; lastTicket = c; }
    }
  }
  if (!tagCols.length) return { records: [], error: 'Não encontrei colunas "tag_..." na planilha.' };
  var records = [], bad = 0;
  for (var r = 1; r < table.length; r++) {
    var row = table[r], d = parseBrDate(row[iDate]);
    if (!d) { bad++; continue; }
    var g = {}, order = [];
    tagCols.forEach(function (c) {
      var v = LABEL_FIX(row[c]);
      if (!v) return;
      var k = head[c].replace(/^tag_/i, '');
      if (c === lastTicket || (c === firstTicket && firstTicket !== lastTicket)) return;
      if (g[k] === undefined) { g[k] = v; order.push(k); }
    });
    var tk = lastTicket >= 0 ? LABEL_FIX(row[lastTicket]) : '';
    if (!tk && firstTicket >= 0) tk = LABEL_FIX(row[firstTicket]);
    records.push({ id: String(row[iId] || '').trim(), t: d, c: String(row[iCons] || '').trim(), n: LABEL_FIX(row[iName]) || 'Sem nome', e: LABEL_FIX(String(row[iIdent] || '').replace(/^e-?mail:\s*/i, '')), g: g, o: order, k: tk });
  }
  return { records: records, skipped: bad, columns: tagCols.length };
}

/* ===== Regras de negócio ===== */
var THEME_BY_SUBMENU = {
  submenu_troca_e_devolucao: 'Troca e devolução', submenu_seguranca_e_privacidade: 'Segurança e privacidade', submenu_produtos: 'Produtos',
  submenu_pedidos: 'Pedidos', submenu_parcerias: 'Parcerias', submenu_pagamentos: 'Pagamentos', submenu_entregas_e_rastreamento: 'Entregas e rastreamento', submenu_conta: 'Conta, loja e site'
};
var THEME_BY_MENU = [
  [/troca|devolu/i, 'Troca e devolução'], [/pedido|compra/i, 'Pedidos'], [/produto|novidade/i, 'Produtos'], [/pagamento|reembolso/i, 'Pagamentos'],
  [/parceria/i, 'Parcerias'], [/entrega|rastreamento/i, 'Entregas e rastreamento'], [/seguran|privacidade/i, 'Segurança e privacidade'], [/conta|loja|site/i, 'Conta, loja e site']

  }

  /* ---------- base de dados ---------- */
  function previewHtml(p) {
    var a = analyze(p.records, S.cfg), st = stats(a.items), rn = a.rounds.map(function (r) { return r.id; }).join(', ');
    return '<div class="kv"><div><b>' + st.n + '</b><span>atendimentos</span></div><div><b>' + f1(st.rate) + '%</b><span>retenção</span></div><div><b>' + st.ticket + '</b><span>tickets</span></div><div><b>' + a.rounds.length + '</b><span>rodadas (' + esc(rn) + ')</span></div></div>' +
      '<p class="sub">Período: ' + fd(st.from) + ' a ' + fd(st.to) + (p.skipped ? ' · ' + p.skipped + ' linha(s) ignorada(s) por data inválida' : '') + '</p>' +
      '<div class="msg">Ao confirmar, <b>toda a base atual é apagada</b> (' + (S.records.length) + ' atendimentos) e esta planilha passa a ser a fonte de dados do painel.</div>' +
      '<div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap"><button class="btn pri" data-act="confirmUpload" type="button"' + (S.busy ? ' disabled' : '') + '>Substituir base atual</button><button class="btn" data-act="cancelUpload" type="button">Cancelar</button></div>';
  }
  function baseModal() {
    var m = S.meta, tabs = '<div class="mtabs"><button class="chip ' + (S.baseTab === 'base' ? 'on' : '') + '" data-act="baseTab" data-k="base" type="button">Base de dados</button><button class="chip ' + (S.baseTab === 'rules' ? 'on' : '') + '" data-act="baseTab" data-k="rules" type="button">Regras</button></div>';
    var body = '';
    if (S.baseTab === 'base') {
      body = '<p class="sub">Base atual: <b>' + (m ? esc(m.fileName || 'planilha') + '</b> · ' + m.count + ' atendimentos' : (S.records.length ? 'carregada só neste navegador</b> · ' + S.records.length + ' atendimentos' : 'vazia</b>')) + '</p>' +
        (S.canWrite ? '<div class="drop" id="drop"><p style="margin:0 0 10px">Arraste a planilha aqui ou escolha o arquivo (CSV da exportação do HiBot; XLSX também funciona)</p><input type="file" id="file" accept=".csv,.xlsx,.xls,text/csv" style="max-width:100%"></div>' : '<div class="msg">Seu acesso é só de leitura: não é possível trocar a base.</div>') +
        (S.note ? '<div class="msg ' + S.note.k + '">' + esc(S.note.t) + '</div>' : '') + (S.pending ? previewHtml(S.pending) : '') + (S.static && S.records.length ? '<div style="margin-top:14px"><button class="btn" data-act="dlBase" type="button">Baixar base.json (para publicar no GitHub)</button></div>' : '');
    } else {
      body = '<label class="f">Palavras que identificam a rodada TUC (teste do cliente PUMA)<input type="text" id="cfgKw" value="' + esc(S.cfg.tucKeywords.join(', ')) + '"><span style="font-weight:400;color:var(--muted)">Procuradas no e-mail e no nome do avaliador, separadas por vírgula. Quem não bater com nenhuma vai para a rodada TU (time interno).</span></label>' +
        '<label class="f">Uma nova rodada começa a cada<select id="cfgGroup"><option value="day"' + (S.cfg.groupBy === 'day' ? ' selected' : '') + '>dia de teste</option><option value="week"' + (S.cfg.groupBy === 'week' ? ' selected' : '') + '>semana</option><option value="month"' + (S.cfg.groupBy === 'month' ? ' selected' : '') + '>mês</option></select></label>' +
        '<label class="f" style="grid-template-columns:auto 1fr;align-items:start;gap:10px"><input type="checkbox" id="cfgMail"' + (S.cfg.emailContinue ? ' checked' : '') + ' style="margin-top:3px"><span>Contar "Continuar por e-mail" como ticket, mesmo sem "Outras dúvidas" preenchida<br><span style="font-weight:400;color:var(--muted)">Desligado segue a regra combinada: só "Outras dúvidas" (coluna BP) indica ticket.</span></span></label>' +
        '<div style="margin-top:16px"><button class="btn pri" data-act="saveCfg" type="button">Salvar regras</button></div>' + (S.note ? '<div class="msg ' + S.note.k + '">' + esc(S.note.t) + '</div>' : '');
    }
    openModal('<h3>Atualizar base</h3>' + tabs + body);
    wireFile();
  }
  function wireFile() {
    var inp = $('file'), drop = $('drop');
    if (inp) inp.addEventListener('change', function () { if (inp.files[0]) readFile(inp.files[0]); });
    if (drop) {
      ['dragenter', 'dragover'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); }); });
      ['dragleave', 'drop'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); }); });
      drop.addEventListener('drop', function (e) { var f = e.dataTransfer && e.dataTransfer.files[0]; if (f) readFile(f); });
    }
  }
  function loadSheetJS() {
    return new Promise(function (res, rej) {
      if (window.XLSX) return res(window.XLSX);
      var s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      s.onload = function () { res(window.XLSX); }; s.onerror = function () { rej(new Error('Não consegui carregar o leitor de XLSX. Envie a planilha em CSV.')); }; document.head.appendChild(s);
    });
  }
  function readFile(file) {
    S.pending = null; S.note = { k: '', t: 'Lendo ' + file.name + '…' }; baseModal();
    var fr = new FileReader();
    fr.onerror = function () { S.note = { k: 'err', t: 'Não consegui ler o arquivo.' }; baseModal(); };
    fr.onload = function () {
      var buf = fr.result, table;
      var done = function (table) {
        var res = tableToRecords(table);
        if (res.error) { S.note = { k: 'err', t: res.error }; S.pending = null; return baseModal(); }
        if (!res.records.length) { S.note = { k: 'err', t: 'Nenhum atendimento com data válida foi encontrado.' }; return baseModal(); }
        S.pending = { fileName: file.name, records: res.records, skipped: res.skipped }; S.note = null; baseModal();
      };
      try {
        if (/\.xlsx?$/i.test(file.name)) {
          loadSheetJS().then(function (X) { var wb = X.read(buf, { type: 'array' }); var ws = wb.Sheets[wb.SheetNames[0]]; done(X.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' })); }).catch(function (e) { S.note = { k: 'err', t: e.message }; baseModal(); });
        } else {
          var txt; try { txt = new TextDecoder('utf-8', { fatal: true }).decode(buf); } catch (e) { txt = new TextDecoder('windows-1252').decode(buf); }
          done(parseDelimited(txt));
        }
      } catch (e) { S.note = { k: 'err', t: 'Erro ao interpretar a planilha: ' + e.message }; baseModal(); }
    };
    fr.readAsArrayBuffer(file);
  }
  function sizeChunks(records) {
    var out = [], cur = [], sz = 0;
    records.forEach(function (r) { var l = JSON.stringify(r).length; if (cur.length && sz + l > 150000) { out.push(cur); cur = []; sz = 0; } cur.push(r); sz += l; });
    if (cur.length) out.push(cur); return out;
  }
  function pad(n) { return ('000' + n).slice(-3); }
  async function confirmUpload() {
    var p = S.pending; if (!p || S.busy) return; S.busy = 'save'; S.note = { k: '', t: 'Salvando…' }; baseModal();
    try {
      if (S.static) {
        var m0 = { batch: Date.now().toString(36), chunks: 1, count: p.records.length, fileName: p.fileName, uploadedAt: new Date().toISOString() };
        var okS = lsSet({ records: p.records, meta: m0, cfg: S.cfg });
        S.meta = m0; S.records = p.records; S.pending = null; S.fromLocal = true;
        S.note = okS ? { k: 'ok', t: 'Base substituída neste navegador: ' + m0.count + ' atendimentos. Para o time inteiro ver, baixe o base.json abaixo e troque o arquivo no GitHub.' } : { k: 'err', t: 'Base aplicada, mas o navegador não deixou salvar (armazenamento cheio ou bloqueado).' };
        S.busy = ''; recompute(true); render(); baseModal(); return;
      }
      if (!S.db) throw { code: 'nodb' };
      var batch = Date.now().toString(36), chunks = sizeChunks(p.records);
      for (var i = 0; i < chunks.length; i++) { await S.db.doc('base/rows-' + batch + '-' + pad(i)).set({ batch: batch, i: i, rows: chunks[i] }); }
      var meta = { batch: batch, chunks: chunks.length, count: p.records.length, fileName: p.fileName, uploadedAt: new Date().toISOString() };
      await S.db.doc('base/meta').set(meta);
      var old = await S.db.collection('base').get();
      for (var j = 0; j < old.docs.length; j++) { var d = old.docs[j], dd = d.data() || {}; if (/^rows-/.test(d.id) && dd.batch !== batch) await S.db.doc('base/' + d.id).delete(); }
      S.meta = meta; S.records = p.records; S.pending = null; S.note = { k: 'ok', t: 'Base substituída: ' + meta.count + ' atendimentos de ' + meta.fileName + '.' };
    } catch (e) {
      S.meta = null; S.records = p.records; S.pending = null; S.localOnly = true;
      S.note = { k: 'err', t: (e && e.code === 'nodb' ? 'O salvamento compartilhado não está disponível nesta visualização.' : 'Não consegui salvar para todos (' + ((e && (e.message || e.code)) || 'erro') + ').') + ' A planilha foi aplicada só neste navegador.' };
    }
    S.busy = ''; recompute(true); render(); baseModal();
  }
  async function saveCfg() {
    var kw = ($('cfgKw').value || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean);
    S.cfg = { tucKeywords: kw, groupBy: $('cfgGroup').value, emailContinue: $('cfgMail').checked };
    var ok = true;
    if (S.static) { var cur = lsGet() || { records: S.records, meta: S.meta }; cur.cfg = S.cfg; ok = lsSet(cur); if (ok) { S.note = { k: 'ok', t: 'Regras salvas neste navegador. Para valerem para o time, baixe o base.json e troque no GitHub.' }; recompute(true); render(); return baseModal(); } }
    else if (S.db) { try { await S.db.doc('base/config').set(S.cfg); } catch (e) { ok = false; } } else ok = false;
    S.note = ok ? { k: 'ok', t: 'Regras salvas.' } : { k: 'err', t: 'Regras aplicadas só neste navegador (não consegui salvar para todos).' };
    recompute(true); render(); baseModal();
  }

  /* ---------- banco compartilhado ---------- */
  var tmr = null;
  function applySnapshot(snap) {
    var docs = {}; snap.docs.forEach(function (d) { docs[d.id] = d.data(); });
    if (docs.config) S.cfg = { tucKeywords: docs.config.tucKeywords || ['puma'], groupBy: docs.config.groupBy || 'day', emailContinue: !!docs.config.emailContinue };
    var meta = docs.meta;
    if (!meta) { if (!S.localOnly) { S.meta = null; S.records = []; } }
    else {
      var chunks = snap.docs.filter(function (d) { return /^rows-/.test(d.id) && d.data().batch === meta.batch; }).sort(function (a, b) { return a.data().i - b.data().i; });
      if (chunks.length < meta.chunks) return;
      var rows = []; chunks.forEach(function (c) { rows = rows.concat(c.data().rows || []); });
      S.records = rows; S.meta = meta; S.localOnly = false;
    }
    S.status = 'ready'; clearTimeout(tmr); tmr = setTimeout(function () { recompute(false); render(); if ($('ovl').classList.contains('open') && S.openFile) baseModal(); }, 120);
  }
  var LS = 'puma-assistente-base-v1';
  function lsGet() { try { return JSON.parse(localStorage.getItem(LS) || 'null'); } catch (e) { return null; } }
  function lsSet(o) { try { localStorage.setItem(LS, JSON.stringify(o)); return true; } catch (e) { return false; } }
  async function initStatic() {
    S.static = true; S.canWrite = true;
    var base = null;
    try { var r = await fetch('base.json', { cache: 'no-store' }); if (r.ok) base = await r.json(); } catch (e) {}
    var loc = lsGet(), use = loc && loc.records && loc.records.length ? loc : base;
    if (use && use.records) { S.records = use.records; S.meta = use.meta || null; if (use.cfg) S.cfg = use.cfg; S.fromLocal = use === loc; }
    S.status = 'ready'; recompute(true); render();
  }
  async function initDb() {
    try {
      var u = window.claude && await window.claude.use('user');
      if (u && u.can) { var c = u.can('data.write'); S.canWrite = c !== false; }
    } catch (e) {}
    try {
      var db = window.claude && await window.claude.use('db');
      if (!db) { await initStatic(); return; }
      S.db = db;
      db.collection('base').onSnapshot(applySnapshot, function () { S.status = 'ready'; render(); });
    } catch (e) { await initStatic(); }
  }

  /* ---------- eventos ---------- */
  document.addEventListener('click', function (e) {
    if (e.target.id === 'ovl') return closeModal();
    var b = e.target.closest('[data-act]'); if (!b) return;
    var a = b.getAttribute('data-act'), d = b.dataset;
    if (a === 'close') closeModal();
    else if (a === 'openBase') { S.baseTab = 'base'; S.openFile = true; S.note = null; S.pending = null; baseModal(); }
    else if (a === 'baseTab') { S.baseTab = d.k; S.note = null; baseModal(); }
    else if (a === 'cancelUpload') { S.pending = null; S.note = null; baseModal(); }
    else if (a === 'confirmUpload') confirmUpload();
    else if (a === 'saveCfg') saveCfg();
    else if (a === 'dlBase') { var blob = new Blob([JSON.stringify({ meta: S.meta, cfg: S.cfg, records: S.records })], { type: 'application/json' }), u = URL.createObjectURL(blob), al = document.createElement('a'); al.href = u; al.download = 'base.json'; document.body.appendChild(al); al.click(); al.remove(); setTimeout(function () { URL.revokeObjectURL(u); }, 1000); }
    else if (a === 'selAll') { var rs = roundsOf(d.type), all = rs.every(function (r) { return S.sel[r.id]; }), other = S.A.rounds.some(function (r) { return r.type !== d.type && S.sel[r.id]; }); if (all && !other) return; rs.forEach(function (r) { S.sel[r.id] = !all; }); render(); }
    else if (a === 'selToggle') { var n = S.A.rounds.filter(function (r) { return S.sel[r.id]; }).length; if (S.sel[d.id] && n === 1) return; S.sel[d.id] = !S.sel[d.id]; render(); }
    else if (a === 'tab') { S.tab = d.id; render(); }
    else if (a === 'cmRound') { S.cm[d.type] = d.id ? (S.cm[d.type] === d.id ? null : d.id) : null; S.cm.limit = 40; render(); }
    else if (a === 'cmOut') { S.cm.out = d.k; S.cm.limit = 40; render(); }
    else if (a === 'more') { S.cm.limit += 40; render(); }
    else if (a === 'item') { var it = S.A.items[+d.i]; if (it) openModal('<h3>Atendimento</h3><p class="sub" style="margin:0">' + esc(it.r.id) + '</p>' + itemBlock(it)); }
    else if (a === 'focus') { S.focus = (d.k && d.k !== S.focus) ? d.k : null; render(); }
    else if (a === 'themeAll') timelineModal(d.t);
    else if (a === 'theme') { listModal(d.t, 'Rodada ' + S.tab, sub(itemsOfRound(S.tab)).filter(function (it) { return it.theme === d.t; })); }
    else if (a === 'tester') { var items = sub(itemsOfRound(S.tab)).filter(function (it) { return it.r.n.trim().toLowerCase() === d.k; }); listModal(items[0] ? items[0].r.n : d.k, 'Rodada ' + S.tab, items); }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); else if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('clk')) { e.preventDefault(); e.target.click(); } });
  $('today').textContent = new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

  recompute(true); render(); initDb();
})();

</script>

</body>
</html>
